name: Build Life Saver APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check ZIP file
        run: |
          echo "Files in repository:"
          ls -la
          test -f "$GITHUB_WORKSPACE/life saver. zip"

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -q "$GITHUB_WORKSPACE/life saver. zip" -d android-project

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/android-project" -name settings.gradle.kts -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "settings.gradle.kts not found"
            find "$GITHUB_WORKSPACE/android-project" -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug
          else
            gradle clean assembleDebug
          fi

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Searching for APK..."
          find app/build/outputs/apk -type f -name "*.apk" -print

          APK=$(find app/build/outputs/apk -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Life-Saver-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
