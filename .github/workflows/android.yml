name: Build Life Saver APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check ZIP file
        run: |
          echo "Files in repository:"
          ls -la
          echo "Checking ZIP:"
          ls -lh "$GITHUB_WORKSPACE/life saver. zip"

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -q "$GITHUB_WORKSPACE/life saver. zip" -d android-project

      - name: Find Android project
        run: |
          PROJECT_DIR=$(dirname "$(find "$GITHUB_WORKSPACE/android-project" -name settings.gradle.kts -print -quit)")
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "Android project settings.gradle.kts not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create debug keystore
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          ls -lh debug.keystore

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Find APK
        if: success()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "APK files:"
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Life-Saver-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
