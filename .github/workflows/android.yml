name: Build Life Saver APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check ZIP file
        run: |
          echo "Files in repository:"
          ls -la
          echo "Checking ZIP:"
          ls -lh "$GITHUB_WORKSPACE/life-saver.zip"

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -q "$GITHUB_WORKSPACE/life-saver.zip" -d android-project

      - name: Find Android project
        run: |
          PROJECT_DIR=$(dirname "$(find "$GITHUB_WORKSPACE/android-project" -name settings.gradle.kts -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Life-Saver-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
